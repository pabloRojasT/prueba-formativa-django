<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
</head>
<body>
    <h1>{{ titulo }}</h1>
    <p>Total de videojuegos: {{ total }}</p>
    <ul>
        {% for juego in juegos %}
            <li>
                <a href="{% url 'catalogo:detalle' juego.id %}">{{ juego.nombre }}</a>
                - {{ juego.genero }} - ${{ juego.precio }}
            </li>
        {% empty %}
            <li>No hay videojuegos disponibles.</li>
        {% endfor %}
    </ul>
</body>
</html>
